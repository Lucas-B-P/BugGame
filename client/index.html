<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bug.io</title>
    <style>
      :root {
        --ink: #1a1f2e;
        --cream: #f4efe6;
        --accent: #c45c26;
        --panel: rgba(18, 24, 36, 0.82);
        --line: rgba(255, 248, 231, 0.14);
        --ui-font: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        font-family: var(--ui-font); color: var(--cream);
        background: radial-gradient(ellipse at 20% 10%, #3d5a40, #1a2330 55%, #12161f);
      }
      #boot {
        position: fixed; inset: 0; z-index: 30; overflow: auto;
        display: grid; place-items: center; padding: 24px 16px;
        background:
          radial-gradient(circle at 80% 20%, rgba(196,92,38,0.25), transparent 40%),
          radial-gradient(circle at 20% 80%, rgba(76,201,240,0.12), transparent 35%),
          linear-gradient(165deg, #243528, #141a24 60%);
      }
      #boot.hidden { display: none; }
      .panel {
        width: min(980px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 28px 24px 22px;
        backdrop-filter: blur(8px);
      }
      .brand {
        font-family: var(--ui-font);
        font-weight: 700;
        font-size: clamp(2.4rem, 7vw, 3.6rem);
        margin: 0; letter-spacing: -0.03em;
        text-align: center;
        text-shadow: 0 3px 0 rgba(0,0,0,0.25);
      }
      .tag { text-align: center; opacity: 0.8; margin: 0.35rem 0 1.4rem; }
      .section-title {
        font-family: var(--ui-font); font-weight: 700; font-size: 1.05rem;
        margin: 1.1rem 0 0.55rem; opacity: 0.95;
      }
      .name-row { display: flex; gap: 0.6rem; }
      input[type="text"] {
        flex: 1; border: 0; border-radius: 10px; padding: 0.85rem 1rem;
        font: inherit; background: var(--cream); color: var(--ink); outline: none;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 0.55rem;
      }
      .card {
        border: 2px solid transparent;
        border-radius: 12px;
        background: rgba(255,255,255,0.04);
        padding: 0.45rem;
        cursor: pointer;
        text-align: center;
        transition: border-color 0.15s, transform 0.15s;
      }
      .card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.2); }
      .card.selected { border-color: var(--accent); background: rgba(196,92,38,0.18); }
      .card img {
        width: 64px; height: 64px; object-fit: contain;
        image-rendering: pixelated;
        display: block; margin: 0 auto 0.35rem;
      }
      .card .name { font-size: 0.72rem; line-height: 1.2; }
      .progress {
        margin-top: 0.8rem; font-size: 0.85rem; opacity: 0.75; text-align: center;
      }
      .actions { display: flex; justify-content: center; margin-top: 1.25rem; }
      #play {
        border: 0; border-radius: 12px; padding: 0.95rem 2rem;
        font-family: var(--ui-font); font-size: 1.15rem; font-weight: 700;
        background: var(--accent); color: white; cursor: pointer;
      }
      #play:hover { filter: brightness(1.06); }
      .hints { text-align: center; margin-top: 0.9rem; font-size: 0.8rem; opacity: 0.65; }
      #game { width: 100vw; height: 100vh; }
      #hud {
        position: fixed; inset: 0; pointer-events: none; z-index: 10; display: none;
      }
      #hud.visible { display: block; }
      .bar-wrap { position: absolute; left: 16px; top: 16px; width: 240px; }
      .label {
        font-family: var(--ui-font); font-weight: 600; color: white;
        text-shadow: 0 1px 2px rgba(0,0,0,0.45); margin-bottom: 4px; font-size: 0.95rem;
      }
      .equip-row {
        display: flex; gap: 10px; margin-top: 8px;
      }
      .equip-slot {
        width: 64px; text-align: center;
      }
      .equip-icon {
        width: 56px; height: 56px; border-radius: 12px;
        background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.18);
        display: grid; place-items: center; margin: 0 auto 4px;
        box-shadow: 0 0 0 0 transparent;
      }
      .equip-icon img {
        width: 42px; height: 42px; object-fit: contain;
        image-rendering: pixelated;
      }
      .equip-icon.empty { opacity: 0.45; }
      .equip-name {
        font-size: 0.68rem; color: rgba(255,255,255,0.9);
        text-shadow: 0 1px 2px rgba(0,0,0,0.5); line-height: 1.15;
      }
      .bar {
        height: 12px; border-radius: 999px; background: rgba(0,0,0,0.35);
        overflow: hidden; margin-bottom: 8px;
      }
      .bar > span { display: block; height: 100%; width: 0%; }
      #hp-fill { background: #e63946; }
      #xp-fill { background: #4cc9f0; }
      #xp-panel {
        position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
        width: min(420px, calc(100vw - 32px));
        text-align: center;
      }
      #xp-label {
        font-family: var(--ui-font); font-weight: 600; color: white;
        text-shadow: 0 1px 2px rgba(0,0,0,0.5); margin-bottom: 6px; font-size: 0.92rem;
      }
      #xp-panel .bar { height: 14px; margin-bottom: 0; }
      #stats {
        position: absolute; right: 16px; top: 16px; text-align: right; color: white;
        text-shadow: 0 1px 2px rgba(0,0,0,0.45); font-family: var(--ui-font); font-weight: 600;
      }
      #event-banner {
        position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
        background: rgba(28,36,22,0.7); color: var(--cream);
        padding: 0.45rem 1rem; border-radius: 999px;
        font-family: var(--ui-font); font-weight: 600; opacity: 0; transition: opacity 0.25s ease;
      }
      #event-banner.show { opacity: 1; }
      #evolve { display: none !important; }
      #toast {
        position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%);
        color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        font-family: var(--ui-font); font-weight: 600; opacity: 0; transition: opacity 0.2s ease;
      }
      #toast.show { opacity: 1; }
      #controls {
        position: absolute; right: 16px; bottom: 16px;
        color: rgba(255,255,255,0.8); font-size: 0.8rem; line-height: 1.45;
        text-shadow: 0 1px 2px rgba(0,0,0,0.4); text-align: right;
      }
      #minimap {
        position: absolute; left: 14px; bottom: 14px;
        width: 192px;
        pointer-events: none;
      }
      #minimap-frame {
        position: relative;
        width: 192px; height: 192px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow:
          0 0 0 2px rgba(255,232,163,0.4),
          0 8px 24px rgba(0,0,0,0.45);
        background: #5f8f45;
      }
      #minimap-canvas {
        display: block; width: 192px; height: 192px;
        image-rendering: auto;
      }
      #minimap-title {
        position: absolute; left: 8px; top: 6px;
        font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em;
        color: rgba(255,248,231,0.85);
        text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      }
      #minimap-legend {
        margin-top: 6px;
        display: flex; flex-wrap: wrap; gap: 6px 10px;
        font-size: 0.62rem; color: rgba(255,255,255,0.78);
        text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      }
      #minimap-legend span { display: inline-flex; align-items: center; gap: 4px; }
      #minimap-legend i {
        display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      }
      #minimap-legend .you { background: #4cc9f0; }
      #minimap-legend .boss { background: #9b5de5; }
      #minimap-legend .shield { background: #c9a227; }
      #minimap-legend .rank { background: #ffd700; }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="panel">
        <h1 class="brand">Bug.io</h1>
        <p class="tag">Coma, evolua e liberte um novo poder a cada forma.</p>

        <div class="section-title">Seu nome</div>
        <div class="name-row">
          <input id="name" maxlength="16" placeholder="Seu nome" autocomplete="off" />
        </div>

        <div class="section-title">Linha de evolução</div>
        <div id="evo-preview" class="grid"></div>

        <p class="progress" id="progress-label"></p>

        <div class="actions">
          <button id="play" type="button">Jogar</button>
        </div>
        <p class="hints">WASD mover - Mouse mirar - Clique atacar (cajado) - Espaço poder - Shift dash</p>
      </div>
    </div>

    <div id="hud">
      <div class="bar-wrap">
        <div class="label" id="species-label">Herói</div>
        <div class="bar"><span id="hp-fill"></span></div>
        <div class="equip-row">
          <div class="equip-slot">
            <div class="equip-icon" id="weapon-icon"><img id="weapon-img" alt="" /></div>
            <div class="equip-name" id="weapon-name">Cajado</div>
          </div>
          <div class="equip-slot">
            <div class="equip-icon empty" id="shield-icon"><img id="shield-img" alt="" /></div>
            <div class="equip-name" id="shield-name">Sem escudo</div>
          </div>
        </div>
      </div>
      <div id="stats">
        <div id="food-label">Comida 0</div>
        <div id="level-label">Nv. 1</div>
      </div>
      <div id="event-banner"></div>
      <div id="toast"></div>
      <div id="evolve"></div>
      <div id="xp-panel">
        <div id="xp-label">XP 0 / 50</div>
        <div class="bar"><span id="xp-fill"></span></div>
      </div>
      <div id="minimap">
        <div id="minimap-frame">
          <canvas id="minimap-canvas" width="192" height="192"></canvas>
          <div id="minimap-title">MAPA</div>
        </div>
        <div id="minimap-legend">
          <span><i class="you"></i>Você</span>
          <span><i class="boss"></i>Boss</span>
          <span><i class="shield"></i>Escudo</span>
          <span><i class="rank"></i>Top 1</span>
        </div>
      </div>
      <div id="controls">WASD - Clique (cajado) - Espaço - Shift</div>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
